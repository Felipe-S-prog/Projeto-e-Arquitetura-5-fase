<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aplicações — SGP</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand-group">
      <span class="brand">SGP</span>
      <span class="brand-sub">Sistema de Geração de Provas</span>
    </div>
    <nav class="top-nav">
      <a href="provas.html">Provas</a>
      <a href="aplicacoes.html" class="active">Aplicações</a><a href="banco-questoes.html">Banco de Questões</a><a href="turmas.html">Turmas</a>
    </nav>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1>Aplicações</h1>
        <p>Provas já associadas a uma turma. A mesma prova pode gerar várias aplicações (turmas diferentes, ou reaplicação).</p>
      </div>
      <a class="btn-primary" href="nova-aplicacao.html">+ Nova Aplicação</a>
    </div>

    <ul class="exam-list" id="application-list"></ul>

    <p class="empty-hint" id="empty-hint" hidden>
      Nenhuma aplicação criada ainda. Escolha uma prova e uma turma para começar.
    </p>
  </main>

  <script>
    // Mock — Feature 5 (Criação de Aplicação) da spec do SGP.
    // A geração do PDF/versões (Feature 6) é parte do Matheus; aqui a
    // aplicação nasce sempre em "draft".
    const applicationsMock = [
      {
        id: "app-1",
        examTitle: "Avaliação 1 — Estruturas de Dados",
        className: "ED - Turma A (2026/1)",
        status: "generated",
      },
      {
        id: "app-2",
        examTitle: "Recuperação — Banco de Dados I",
        className: "BD1 - Turma Noturno (2026/1)",
        status: "draft",
      },
    ];

    const statusLabel = {
      draft: "Rascunho",
      generated: "PDF Gerado",
      closed: "Encerrada",
    };

    // Reaproveita as classes de badge já existentes (draft/ready/closed) —
    // "generated" usa o estilo de "ready" (pronta).
    const statusClass = {
      draft: "badge-draft",
      generated: "badge-ready",
      closed: "badge-closed",
    };

    function renderApplications(applications) {
      const list = document.getElementById("application-list");
      const emptyHint = document.getElementById("empty-hint");

      if (applications.length === 0) {
        emptyHint.hidden = false;
        return;
      }

      applications.forEach((app) => {
        const item = document.createElement("li");
        item.innerHTML = `
          <div class="exam-card">
            <div class="exam-main">
              <p class="exam-title">${app.examTitle}</p>
              <div class="exam-meta">
                <span>${app.className}</span>
              </div>
            </div>
            <span class="badge ${statusClass[app.status]}">${statusLabel[app.status]}</span>
          </div>
        `;
        list.appendChild(item);
      });
    }

    renderApplications(applicationsMock);
  </script>

</body>
</html>
