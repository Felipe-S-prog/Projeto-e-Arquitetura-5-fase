name: CI - Testes e Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: n3-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      N3_MYSQL_TEST: 'true'
      N3_MYSQL_PASSWORD: n3-test-password
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_USER: root
      TEST_DB_PASSWORD: n3-test-password
      TEST_DB_NAME: sgp_ci_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Instalar dependências do servidor
        run: npm ci
        working-directory: server

      - name: Testes do servidor com cobertura
        run: npm test -- --experimental-test-coverage
        working-directory: server

      - name: Instalar dependências do frontend
        run: npm ci
        working-directory: client

      - name: Lint do frontend
        run: npm run lint
        working-directory: client

      - name: Build do frontend
        run: npm run build
        working-directory: client
